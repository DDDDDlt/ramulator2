Frontend:
  impl: LoadStoreTrace
  path: ./baseline.ldst.trace
  clock_ratio: 1

# Translation:
#   impl: NoTranslation
Translation:
  impl: RandomTranslation
  max_addr: 1000000000 

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1

  DRAM:
    impl: DDR4
    org:
      preset: DDR4_8Gb_x8
      channel: 2
      rank: 1
    timing:
      preset: DDR4_2400R 

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: OpenRowPolicy
      cap: 4
    plugins:

  AddrMapper:
    impl: RoBaRaCoCh
